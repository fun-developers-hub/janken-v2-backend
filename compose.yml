services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ALLOW_ORIGINS: "*"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: password
      DB_NAME: janken
    depends_on:
      mysql:
        condition: service_healthy
    user: "root"
    volumes:
      - ./log:/app-log
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: janken
      MYSQL_USER: app
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: migrate/migrate:latest
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "mysql://app:password@tcp(mysql:3306)/janken",
        "up",
      ]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
