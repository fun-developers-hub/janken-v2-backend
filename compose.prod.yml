services:
  app:
    image: ghcr.io/fun-developers-hub/janken-v2-backend:latest
    restart: always
    ports:
      - "127.0.0.1:8123:8080"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  mysql:
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # 注: DB は Watchtower の自動更新対象にしない(label を付けない)

  # GHCR を定期的にチェックし、新イメージがあれば app を自動で pull→再起動する。
  # 一度起動すれば放置でよい。
  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_CLEANUP: "true" # 古いイメージを削除
      WATCHTOWER_LABEL_ENABLE: "true" # label の付いたコンテナのみ監視(= app だけ)
      WATCHTOWER_POLL_INTERVAL: "30" # 30秒ごとにチェック(最悪でも30秒で反映)
      DOCKER_API_VERSION: "1.44" # 新しい Docker daemon(最低 API 1.40)と互換にする
    security_opt:
      - no-new-privileges:true

  # マイグレーション適用用のワンショット(.env の DB_URL を使う)。スキーマ変更時のみ手動実行。
  # 適用: docker compose -f compose.prod.yml --profile tools run --rm migrate
  migrate:
    image: migrate/migrate:latest
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "mysql://${DB_USER}:${DB_PASSWORD}@tcp(mysql:3306)/${DB_NAME}",
        "up",
      ]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
